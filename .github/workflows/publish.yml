name: Publish npm Package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Version tag to verify, for example v0.1.3
        required: true
        type: string
      publish:
        description: Publish the verified artifact using npm Trusted Publishing
        type: boolean
        default: false
      stage:
        description: Stage the first npm release for owner verification
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  pack:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify release identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            assert.equal(pkg.name, "@pickcat/image-normalizer");
            assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
            assert.equal(pkg.publishConfig.registry, "https://registry.npmjs.org/");
          '
      - name: Verify release tag matches the source commit
        if: github.event_name == 'push' || inputs.publish || inputs.stage
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          [ "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$GITHUB_SHA" ]
      - name: Build and test the release tarball
        run: |
          mkdir -p "$RUNNER_TEMP/image-normalizer"
          npm pack --pack-destination "$RUNNER_TEMP/image-normalizer"
          set -- "$RUNNER_TEMP/image-normalizer/"*.tgz
          [ "$#" -eq 1 ]
          node scripts/package-smoke.mjs "$1"
      - uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: ${{ runner.temp }}/image-normalizer/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: pack
    if: github.event_name == 'workflow_dispatch' && inputs.stage && !inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npm-bootstrap.npmrc
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/image-normalizer
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Start npm owner login
        run: |
          # 首次包注册由 GitHub 托管机器登录；只分享登录链接，不输出会话令牌。
          (
            set +e
            npm login --registry=https://registry.npmjs.org/ --auth-type=web --browser=false > "$RUNNER_TEMP/npm-login.log" 2>&1
            echo "$?" > "$RUNNER_TEMP/npm-login.status"
          ) < /dev/null &
          for attempt in $(seq 1 60); do
            if grep -E '^https://www.npmjs.com/login' "$RUNNER_TEMP/npm-login.log" > "$RUNNER_TEMP/npm-login-url.txt"; then
              exit 0
            fi
            if [ -f "$RUNNER_TEMP/npm-login.status" ]; then
              echo "::error::npm login ended before generating a login URL."
              exit 1
            fi
            sleep 1
          done
          echo "::error::npm login did not generate a login URL."
          exit 1
      - uses: actions/upload-artifact@v6
        with:
          name: npm-owner-login-url
          path: ${{ runner.temp }}/npm-login-url.txt
          if-no-files-found: error
          retention-days: 1
      - name: Wait for owner login
        run: |
          for attempt in $(seq 1 300); do
            if [ -f "$RUNNER_TEMP/npm-login.status" ]; then
              [ "$(cat "$RUNNER_TEMP/npm-login.status")" = 0 ]
              exit
            fi
            sleep 2
          done
          echo "::error::Owner login was not completed within ten minutes."
          exit 1
      - name: Stage verified artifact for owner approval
        run: |
          cd "$RUNNER_TEMP/image-normalizer"
          set -- ./*.tgz
          [ "$#" -eq 1 ]
          npm stage publish "$1" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/
      - name: End bootstrap login
        if: always()
        run: |
          npm logout --registry=https://registry.npmjs.org/ || true
          rm -f "$NPM_CONFIG_USERCONFIG" "$RUNNER_TEMP/npm-login.log" "$RUNNER_TEMP/npm-login.status"

  publish:
    needs: pack
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: npm-package
          path: ${{ runner.temp }}/image-normalizer
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - name: Publish the verified artifact
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/image-normalizer"
          set -- ./*.tgz
          [ "$#" -eq 1 ]
          tar -xOf "$1" package/package.json > metadata.json
          node --input-type=module -e '
            import assert from "node:assert/strict";
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("metadata.json", "utf8"));
            assert.equal(pkg.name, "@pickcat/image-normalizer");
            assert.equal(process.env.RELEASE_TAG, `v${pkg.version}`);
          '
          version="${RELEASE_TAG#v}"
          expected="sha512-$(openssl dgst -sha512 -binary "$1" | openssl base64 -A)"
          if published=$(npm view "@pickcat/image-normalizer@$version" dist.integrity --registry https://registry.npmjs.org/ 2>/dev/null); then
            if [ "$published" != "$expected" ]; then
              echo "::error::Published version has a different integrity; bump the version."
              exit 1
            fi
          else
            npm publish "$1" --ignore-scripts --access public --provenance --registry https://registry.npmjs.org/
          fi
          npm view "@pickcat/image-normalizer@$version" dist.integrity --registry https://registry.npmjs.org/ > integrity.txt
          [ "$(cat integrity.txt)" = "$expected" ]
          shasum -a 256 "$1" > SHA256SUMS
      - name: Attach artifact to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd "$RUNNER_TEMP/image-normalizer"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create "$RELEASE_TAG" ./*.tgz SHA256SUMS --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
